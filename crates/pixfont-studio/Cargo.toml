[package]
name = "pixfont-studio"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
app_data = "0.1.1"
glam = "0.33.1"
iced = { version = "0.14.0", features = ["advanced", "image", "svg"] }
iced_aw = "0.14.1"
image = "0.25.10"
itertools = "0.15.0"
open = "5.3.5"
pixfont = { path = "../pixfont" }
regex = "1.13.0"
rfd = { version = "0.17.2", features = ["xdg-portal"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.2"
