[workspace]
resolver = "3"
members = [
    "crates/pixfont",
    "crates/pixfont-studio",
    "crates/pixicons", "crates/pixicons-macros",
    "crates/ucd",
    "crates/ucd-macros",
]

[workspace.dependencies]
iced = { version = "0.14.0", features = ["advanced", "image", "svg"] }
serde = { version = "1.0.228", features = ["derive"] }
indexmap = "2.14.0"
thiserror = "2.0.18"
toml = "1.1.2"
image = "0.25.10"
