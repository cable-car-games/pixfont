name: Check

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Canary
        run: |
          set -e
          ! grep -R 'FIXME(AIGEN)'   --exclude AGENTS.md --exclude CLAUDE.md --exclude .github/workflows/check.yml
          ! grep -R 'SPDX-.\+\[AI\]' --exclude AGENTS.md --exclude CLAUDE.md --exclude .github/workflows/check.yml

      - name: Install dependencies
        run: sudo apt-get install -y libx11-dev libxkbcommon-dev libxrandr-dev reuse

      - run: reuse lint
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Canary
        run: |
          set -e
          ! grep -R 'FIXME(AIGEN)'   --exclude AGENTS.md --exclude CLAUDE.md --exclude .github/workflows/check.yml
          ! grep -R 'SPDX-.\+\[AI\]' --exclude AGENTS.md --exclude CLAUDE.md --exclude .github/workflows/check.yml

      - name: Install dependencies
        run: sudo apt-get install -y libx11-dev libxkbcommon-dev libxrandr-dev

      - uses: Swatinem/rust-cache@v2
      - run: cargo test --verbose
